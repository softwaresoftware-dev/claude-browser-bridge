name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        # Ubuntu's chromium-browser is a snap and can't read /tmp where the
        # test extension lives, so it never loads. Use real Chrome.
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: pip install pytest

      - name: Build
        run: make build

      - name: Manifest tests
        run: make test-manifest

      - name: Browser tests (a11y suite only, debug)
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CI_NO_SANDBOX: "1"
        # Iterating on CI flakes — run smallest suite with chrome stderr
        # piped through so we can diagnose. Switch back to `make test-ext`
        # once green.
        run: xvfb-run --auto-servernum node tests/extension/test-observe-a11y.js
