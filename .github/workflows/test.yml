name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xvfb + chrome deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64

      - name: Install Chrome for Testing
        id: chrome
        # Stable Google Chrome refuses --disable-extensions-except / --load-extension
        # for security. Chrome for Testing (the puppeteer-managed build) allows
        # those flags and is the supported path for extension testing.
        run: |
          npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome -executable | head -1)
          echo "Chrome for Testing at $CHROME_BIN"
          "$CHROME_BIN" --version
          echo "chrome-path=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: pip install pytest

      - name: Build
        run: make build

      - name: Manifest tests
        run: make test-manifest

      - name: Browser tests
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CI_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum make test-ext
