name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        # Ubuntu's chromium-browser is a snap and can't read /tmp where the
        # test extension lives, so it never loads. Use real Chrome.
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: pip install pytest

      - name: Build
        run: make build

      - name: Manifest tests
        run: make test-manifest

      - name: Browser tests
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Run Chrome headed under xvfb instead of true headless.
          # Puppeteer's headless mode uses chrome-headless-shell which
          # doesn't load MV3 extensions; xvfb gives us a virtual display
          # so headed Chrome works without a real screen.
          CI_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum make test-ext
