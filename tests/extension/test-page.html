<!DOCTYPE html>
<html>
<head>
  <title>Browser Bridge Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #output { background: #f0f0f0; padding: 10px; margin: 10px 0; min-height: 50px; }
    input, button { margin: 5px; padding: 8px; }
    .test-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
    #hidden-el { display: none; }
    #zero-size { width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <h1 id="title">Browser Bridge Test Page</h1>

  <div class="test-section">
    <h2>Form Test</h2>
    <input type="text" id="name-input" placeholder="Name" />
    <input type="email" id="email-input" placeholder="Email" />
    <input type="text" id="search-input" placeholder="Search" />
    <button id="submit-btn" onclick="document.getElementById('output').textContent = 'Form submitted: ' + document.getElementById('name-input').value">Submit</button>
  </div>

  <div class="test-section">
    <h2>Click Test</h2>
    <button id="click-btn" onclick="this.textContent = 'Clicked!'; this.dataset.clicked = 'true'">Click Me</button>
    <button id="counter-btn" onclick="this.dataset.count = (parseInt(this.dataset.count || 0) + 1); this.textContent = 'Count: ' + this.dataset.count" data-count="0">Count: 0</button>
  </div>

  <div class="test-section">
    <h2>Dynamic Content Test</h2>
    <button id="add-element-btn" onclick="setTimeout(() => { const el = document.createElement('div'); el.id = 'dynamic-el'; el.textContent = 'I appeared!'; document.getElementById('dynamic-area').appendChild(el); }, 500)">Add Element (500ms delay)</button>
    <div id="dynamic-area"></div>
  </div>

  <div class="test-section">
    <h2>Scroll Test</h2>
    <div id="scroll-container" style="height: 100px; overflow-y: scroll; border: 1px solid #999;">
      <div style="height: 500px; padding: 10px;">
        <p>Top of scrollable area</p>
        <p style="margin-top: 400px;" id="scroll-bottom">Bottom of scrollable area</p>
      </div>
    </div>
  </div>

  <div id="output">Output will appear here</div>

  <!-- Edge case elements -->
  <div id="hidden-el">This is hidden</div>
  <div id="zero-size">Zero size</div>

  <div class="test-section">
    <h2>Shadow DOM Test</h2>
    <div id="shadow-host"></div>
    <script>
      const shadowRoot = document.getElementById('shadow-host').attachShadow({ mode: 'open' });
      shadowRoot.innerHTML = `
        <input type="text" id="shadow-input" aria-label="shadow input" placeholder="Inside shadow root" />
        <button id="shadow-btn">Shadow Click</button>
        <div id="shadow-editor" contenteditable="true" role="textbox" aria-label="shadow editor" style="border: 1px solid #999; min-height: 40px; padding: 4px;"></div>
      `;
      shadowRoot.querySelector('#shadow-btn').addEventListener('click', function () {
        this.textContent = 'Shadow Clicked!';
      });
    </script>
  </div>

  <div class="test-section">
    <h2>Multiline Test</h2>
    <textarea id="multiline-input" rows="4" cols="40"></textarea>
  </div>

  <div class="test-section">
    <h2>Iframe Test</h2>
    <!-- srcdoc inherits the parent origin — same-origin iframe, like the
         real-world case (LinkedIn's /preload/ composer iframe). -->
    <iframe id="test-iframe" style="width: 420px; height: 120px;" srcdoc="
      <input type='text' id='iframe-input' aria-label='iframe input' placeholder='Inside iframe' />
      <button id='iframe-btn' onclick='this.textContent = &quot;Iframe Clicked!&quot;'>Iframe Click</button>
      <textarea id='iframe-textarea' rows='3' cols='30'></textarea>
    "></iframe>
  </div>
</body>
</html>
